[project]
name = "jobq"
version = "0.1.0"
description = "A durable, multi-tenant job queue on PostgreSQL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
